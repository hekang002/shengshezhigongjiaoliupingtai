<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 A｜已办结事项统一台账</title>
  <link rel="icon" href="data:,">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="../prototype-data.js"></script>
  <style>
    :root { --red:#bd2730; --red-soft:#fbecec; --ink:#222426; --muted:#72777c; --line:#ddd9d3; --paper:#f5f4f1; --green:#237459; --green-soft:#eaf6f0; --blue:#326fa8; --blue-soft:#edf4fb; --gold:#a66d13; --gold-soft:#fff4df; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:0; }
    button,input,select { font:inherit; letter-spacing:0; }
    button { cursor:pointer; }
    .topbar { height:66px; display:grid; grid-template-columns:232px minmax(300px,680px) 1fr; align-items:center; gap:36px; padding:0 24px; border-top:3px solid var(--red); border-bottom:1px solid var(--line); background:#fff; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:var(--red); color:#fff; font-size:10px; line-height:1.05; text-align:center; }
    .global-search { height:42px; padding:0 14px; border:1px solid #ccd0d4; background:#fff; color:var(--muted); }
    .account { justify-self:end; font-weight:700; }
    .shell { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:calc(100vh - 66px); }
    .sidebar { padding:20px 12px; background:#292c2f; color:#e9eaeb; }
    .nav { display:grid; gap:6px; }
    .nav button { height:44px; display:flex; align-items:center; gap:10px; padding:0 14px; border:0; background:transparent; color:inherit; text-align:left; }
    .nav .group { margin-top:8px; background:#393d40; border-left:3px solid var(--red); font-weight:800; }
    .nav .child { margin-left:20px; padding-left:18px; color:#d4d7d9; }
    .nav .active { background:var(--red); color:#fff; font-weight:800; }
    .icon { width:17px; height:17px; stroke-width:1.8; }
    main { min-width:0; padding:28px 34px 40px; }
    .decision { display:flex; align-items:center; gap:12px; margin-bottom:12px; color:var(--muted); font-size:12px; }
    .decision b { padding:4px 8px; background:var(--red); color:#fff; }
    h1 { margin:0; font-family:"Songti SC","STSong",serif; font-size:32px; font-weight:700; }
    .subtitle { margin:7px 0 20px; color:var(--muted); }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); background:#fff; }
    .summary div { min-height:76px; padding:14px 17px; border-right:1px solid var(--line); }
    .summary div:last-child { border-right:0; }
    .summary span,.summary strong { display:block; }
    .summary span { color:var(--muted); font-size:12px; }
    .summary strong { margin-top:8px; font-size:25px; }
    .filters { display:grid; grid-template-columns:1.4fr repeat(3,minmax(125px,.7fr)) minmax(240px,1fr) auto; align-items:end; gap:11px; margin:14px 0; padding:15px; border:1px solid var(--line); background:#fff; }
    .field { display:grid; gap:7px; min-width:0; color:var(--muted); font-size:11px; font-weight:700; }
    .field input,.field select { width:100%; height:38px; min-width:0; padding:0 10px; border:1px solid var(--line); background:#fff; color:var(--ink); }
    .date-range { display:grid; grid-template-columns:1fr 18px 1fr; align-items:center; }
    .date-range em { color:var(--muted); font-style:normal; text-align:center; }
    .filter-actions { display:flex; gap:8px; }
    .btn { min-height:38px; padding:0 15px; border:1px solid var(--line); background:#fff; color:var(--ink); }
    .btn.primary { border-color:var(--red); background:var(--red); color:#fff; }
    .table-card { border:1px solid var(--line); background:#fff; overflow:auto; }
    .table-head { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); }
    .table-head strong { font-size:15px; }
    .source-note { display:flex; align-items:center; gap:7px; color:var(--green); font-size:11px; }
    table { width:100%; min-width:1040px; border-collapse:collapse; }
    th,td { padding:13px 14px; border-bottom:1px solid #e9e6e1; text-align:left; vertical-align:top; font-size:12px; }
    th { background:#f5f6f7; color:#596067; font-size:11px; white-space:nowrap; }
    td strong,td small { display:block; }
    td strong { font-size:13px; line-height:1.55; }
    td small { margin-top:4px; color:var(--muted); line-height:1.45; }
    .badge { display:inline-block; padding:3px 7px; background:var(--blue-soft); color:var(--blue); white-space:nowrap; }
    .badge.green { background:var(--green-soft); color:var(--green); }
    .badge.gold { background:var(--gold-soft); color:var(--gold); }
    .view { border:0; background:transparent; color:var(--red); font-weight:700; white-space:nowrap; }
    .empty { padding:42px; color:var(--muted); text-align:center; }
    @media (max-width:1050px) { .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } .filter-actions { justify-content:flex-end; } }
    @media (max-width:760px) { .topbar { grid-template-columns:1fr auto; gap:12px; } .global-search { display:none; } .shell { grid-template-columns:184px minmax(0,1fr); } main { padding:22px 18px; } .summary { grid-template-columns:repeat(2,1fr); } .summary div:nth-child(2) { border-right:0; } .summary div:nth-child(-n+2) { border-bottom:1px solid var(--line); } .filters { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">湖北<br>供销</span>湖北供销 · 心声</div><div class="global-search">⌕　输入关键词，多个关键词请用空格分隔</div><div class="account">管　王敏⌄</div></header>
  <div class="shell">
    <aside class="sidebar"><nav class="nav"><button><i data-lucide="layout-dashboard"></i>工作总览</button><button><i data-lucide="notebook-tabs"></i>内容管理</button><button class="group"><i data-lucide="briefcase-business"></i>承办管理　⌄</button><button class="child"><i data-lucide="layout-list"></i>工作台与任务</button><button class="child"><i data-lucide="clipboard-pen-line"></i>办理反馈</button><button class="child active"><i data-lucide="badge-check"></i>已办结事项</button><button><i data-lucide="clipboard-list"></i>事项办理</button><button><i data-lucide="shield-check"></i>审核管理</button></nav></aside>
    <main>
      <div class="decision"><b>方案 A · 推荐</b><span>统一台账式，同源数据、统一字段、只读查询</span></div>
      <h1>已办结事项</h1><p class="subtitle">查看当前权限范围内已完成答复审核、用户回复和办结归档的事项。</p>
      <section class="summary"><div><span>已办结事项</span><strong id="total">0</strong></div><div><span>公开答复</span><strong id="publicCount">0</strong></div><div><span>私密回复</span><strong id="privateCount">0</strong></div><div><span>按期办结</span><strong id="onTime">0</strong></div></section>
      <form class="filters" id="filters"><label class="field">关键词<input id="query" placeholder="事项名称或编号"></label><label class="field">事项类型<select id="type"><option value="">全部类型</option><option>建言献策</option><option>心声诉求</option></select></label><label class="field">承办部门<select id="owner"><option value="">全部部门</option></select></label><label class="field">答复方式<select id="reply"><option value="">全部方式</option><option>公开答复</option><option>私密回复</option></select></label><label class="field">办结时间<div class="date-range"><input type="date" id="from"><em>至</em><input type="date" id="to"></div></label><div class="filter-actions"><button type="button" class="btn" id="reset">重置</button><button class="btn primary">查询</button></div></form>
      <section class="table-card"><header class="table-head"><strong>办结台账 <span id="visibleCount"></span></strong><span class="source-note"><i data-lucide="database"></i>与“事项办理 / 已办结”同源</span></header><div id="table"></div></section>
    </main>
  </div>
  <script>
    const db=PrototypeData.read();
    const posts=new Map(db.posts.map(item=>[String(item.id),item]));
    const rows=db.affairs.filter(item=>['已反馈','已办结'].includes(item.status)&&['建言献策','心声诉求'].includes(posts.get(String(item.postId))?.board));
    const closedAt=item=>item.closedAt||item.repliedAt||[...(item.events||[])].reverse().find(event=>/办结|审核通过|已反馈/.test(event.text||''))?.at||'未记录';
    const dateValue=value=>String(value||'').match(/\d{4}-\d{2}-\d{2}/)?.[0]||'';
    const typeOf=item=>posts.get(String(item.postId))?.board||item.sourceType||'未记录';
    const replyOf=item=>item.feedback||'公开答复';
    const owners=[...new Set(rows.map(item=>item.owner).filter(Boolean))];
    owner.innerHTML+=[...owners].map(value=>`<option>${value}</option>`).join('');
    total.textContent=rows.length; publicCount.textContent=rows.filter(item=>replyOf(item)==='公开答复').length; privateCount.textContent=rows.filter(item=>replyOf(item)==='私密回复').length; onTime.textContent=rows.filter(item=>!item.deadline||!dateValue(closedAt(item))||dateValue(closedAt(item))<=item.deadline).length;
    function render(){const keyword=query.value.trim().toLowerCase();const visible=rows.filter(item=>(!keyword||`${item.id} ${item.title}`.toLowerCase().includes(keyword))&&(!type.value||typeOf(item)===type.value)&&(!owner.value||item.owner===owner.value)&&(!reply.value||replyOf(item)===reply.value)&&(!from.value||dateValue(closedAt(item))>=from.value)&&(!to.value||dateValue(closedAt(item))<=to.value));visibleCount.textContent=`${visible.length} 项`;table.innerHTML=visible.length?`<table><thead><tr><th>事项名称 / 编号</th><th>事项类型</th><th>承办部门 / 办理人</th><th>优先级</th><th>办理期限</th><th>答复方式</th><th>办结时间</th><th>操作</th></tr></thead><tbody>${visible.map(item=>`<tr><td><strong>${item.title}</strong><small>${item.id}</small></td><td><span class="badge">${typeOf(item)}</span></td><td><strong>${item.owner||'未记录'}</strong><small>${item.assigneeName||item.assigneeId||'未记录'}</small></td><td><span class="badge gold">${item.priority||'一般'}</span></td><td><strong>${item.deadline||'未记录'}</strong><small>已完成</small></td><td><span class="badge ${replyOf(item)==='公开答复'?'green':''}">${replyOf(item)}</span><small>${(item.draft||'未记录答复内容').slice(0,22)}</small></td><td><strong>${closedAt(item)}</strong></td><td><button class="view">查看详情</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无匹配的已办结事项</div>';lucide.createIcons();}
    filters.addEventListener('submit',event=>{event.preventDefault();render();});reset.addEventListener('click',()=>{filters.reset();render();});render();lucide.createIcons();
  </script>
</body>
</html>
